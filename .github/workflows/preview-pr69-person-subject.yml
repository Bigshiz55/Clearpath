name: preview-pr69-person-subject

# BLACK-BOX ACCEPTANCE FOR PR #69, against the real deployed preview.
#
# Lives only on the disposable proof branch `claude/pr69-blackbox-proof`,
# which is PR #69's head (e5b44f2) plus exactly this gate's infrastructure —
# the semantic modules under test are byte-identical to the PR #69 head.
#
# It must never silently skip: a missing preview, a SHA mismatch or a failed
# sign-in exits 2 and FAILS the job with an infrastructure message.

on:
  # Fires when Vercel reports the preview READY. Running on `pull_request`
  # would race the deployment.
  deployment_status:
  # Manual retry with the same resolution logic.
  workflow_dispatch:

permissions:
  contents: read
  deployments: read

jobs:
  black-box:
    if: github.event_name == 'workflow_dispatch' || github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve the deployment under test
        id: target
        env:
          TARGET_URL: ${{ github.event.deployment_status.target_url }}
          ENVIRONMENT: ${{ github.event.deployment.environment }}
          SHA: ${{ github.event.deployment.sha }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Manual runs test the current head's deployment by branch alias.
            echo "url=https://clearpath-git-claude-pr69-blackbox-proof-bigshiz56.vercel.app" >> "$GITHUB_OUTPUT"
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$TARGET_URL" ]; then
            echo "::error::No target_url on the deployment event — cannot resolve the preview."
            exit 1
          fi
          case "$ENVIRONMENT" in
            *[Pp]roduction*)
              echo "Skipping: this gate runs against previews, not production."
              echo "run=false" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          echo "url=$TARGET_URL" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "Deployment: $TARGET_URL (env=$ENVIRONMENT sha=$SHA)"

      - uses: actions/checkout@v4
        if: steps.target.outputs.run == 'true'

      - uses: actions/setup-node@v4
        if: steps.target.outputs.run == 'true'
        with:
          node-version: 20

      - name: Report what is configured (names only, never values)
        if: steps.target.outputs.run == 'true'
        env:
          HAS_LOGIN: ${{ secrets.PREVIEW_TEST_LOGIN_SECRET != '' }}
          HAS_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET != '' }}
          HAS_TMDB: ${{ secrets.TMDB_API_KEY != '' }}
        run: |
          echo "PREVIEW_TEST_LOGIN_SECRET present:        $HAS_LOGIN"
          echo "VERCEL_AUTOMATION_BYPASS_SECRET present:  $HAS_BYPASS"
          echo "TMDB_API_KEY present (full-credits tier): $HAS_TMDB"

      - name: Black-box PR69 person/subject contract
        if: steps.target.outputs.run == 'true'
        env:
          BASE_URL: ${{ steps.target.outputs.url }}
          EXPECT_SHA: ${{ steps.target.outputs.sha }}
          PREVIEW_TEST_LOGIN_SECRET: ${{ secrets.PREVIEW_TEST_LOGIN_SECRET }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          set +e
          node eval/preview/pr69-person-subject.mjs
          code=$?
          set -e
          case $code in
            0) echo "::notice::PR69 person/subject contract holds against the real preview." ;;
            1) echo "::error::SEMANTIC failure — the deployed product violated the PR69 contract." ;;
            2) echo "::error::INFRASTRUCTURE failure — the gate could not run. This is not a product verdict." ;;
            *) echo "::error::Unexpected exit $code" ;;
          esac
          exit $code
