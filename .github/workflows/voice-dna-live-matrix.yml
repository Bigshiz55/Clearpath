name: Voice DNA live matrix

# ═══════════════════════════════════════════════════════════════════════════
# TEMPORARY — runs the Voice DNA live-verification matrix against the Vercel
# PREVIEW deployment for this branch. Deleted together with the preview-only
# test auth (src/lib/previewTestAuth.ts) once verification is complete.
# ═══════════════════════════════════════════════════════════════════════════
#
# Why a workflow at all: the agent environment driving this verification has an
# egress policy that denies *.vercel.app, so it cannot reach the preview it just
# deployed. A GitHub runner can. This is the same pattern ci.yml already uses
# for `browser-routing` — Playwright on ubuntu-latest — pointed at a live URL
# instead of a locally-booted server.
#
# It needs NO secrets. The preview URL is discovered from the GitHub Deployment
# that Vercel itself creates for this commit, so nothing is hardcoded or guessed.
# The test secret it uses lives in the (private) repo and is worthless off a
# preview deployment.

on:
  push:
    branches: [claude/voice-dna-live-verify-n3788j]
  workflow_dispatch:
    inputs:
      preview_url:
        description: 'Override the preview URL (leave blank to auto-discover)'
        required: false
        default: ''

# Read-only. The job needs `deployments: read` to discover the preview URL that
# Vercel published for this commit; it writes nothing back to the repository.
permissions:
  contents: read
  deployments: read

jobs:
  live-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Vercel publishes each preview as a GitHub Deployment whose status
      # carries the environment_url. Polling that is exact — no URL-slug
      # guessing, and it also tells us when the build is actually READY.
      - name: Wait for the Vercel preview deployment
        id: preview
        env:
          GH_TOKEN: ${{ github.token }}
          OVERRIDE: ${{ github.event.inputs.preview_url }}
        run: |
          set -euo pipefail
          if [ -n "${OVERRIDE:-}" ]; then
            echo "url=$OVERRIDE" >> "$GITHUB_OUTPUT"
            echo "Using override: $OVERRIDE"
            exit 0
          fi
          sha="${{ github.sha }}"
          for i in $(seq 1 60); do
            ids=$(gh api "repos/${{ github.repository }}/deployments?sha=$sha&per_page=100" --jq '.[].id' || echo "")
            for id in $ids; do
              url=$(gh api "repos/${{ github.repository }}/deployments/$id/statuses?per_page=100" \
                --jq '[.[] | select(.state=="success") | .environment_url] | map(select(. != null and . != "")) | .[0]' 2>/dev/null || echo "")
              if [ -n "$url" ] && [ "$url" != "null" ]; then
                echo "url=$url" >> "$GITHUB_OUTPUT"
                echo "Preview READY: $url"
                exit 0
              fi
            done
            echo "attempt $i: preview not ready yet for $sha"
            sleep 20
          done
          echo "::error::No successful Vercel preview deployment for $sha after 20 minutes."
          exit 1

      # Run 2 proved this deployment sits behind Vercel Deployment Protection:
      # every path 307s to vercel.com/login?next=/sso-api…, so all fourteen
      # product rows were asserting against Vercel's login page. Vercel's
      # supported answer is "Protection Bypass for Automation" — a secret sent
      # as x-vercel-protection-bypass. Resolve one from a repository secret, or
      # from the project itself via the Vercel API, and mask it either way.
      - name: Resolve the Vercel protection bypass
        id: bypass
        env:
          BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PROJECT_ID: prj_NiCdApPckvfwcU6mym7rjeeBXeP4
          TEAM_ID: team_bYWI8KIn51g31NHNXpYWVEfl
        run: |
          set +e
          echo "VERCEL_AUTOMATION_BYPASS_SECRET present : ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET != '' }}"
          echo "VERCEL_TOKEN present                    : ${{ secrets.VERCEL_TOKEN != '' }}"
          echo "VOICE_DNA_SHARE_TOKEN present           : ${{ secrets.VOICE_DNA_SHARE_TOKEN != '' }}"
          echo "PREVIEW_TEST_SECRET present             : ${{ secrets.PREVIEW_TEST_SECRET != '' }}"
          if [ -n "${BYPASS_SECRET:-}" ]; then
            echo "::add-mask::$BYPASS_SECRET"
            echo "value=$BYPASS_SECRET" >> "$GITHUB_OUTPUT"
            echo "source: repository secret"
            exit 0
          fi
          if [ -n "${VERCEL_TOKEN:-}" ]; then
            secret=$(curl -sS -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v9/projects/$PROJECT_ID?teamId=$TEAM_ID" \
              | jq -r '(.protectionBypass // {}) | keys[0] // empty')
            if [ -n "$secret" ]; then
              echo "::add-mask::$secret"
              echo "value=$secret" >> "$GITHUB_OUTPUT"
              echo "source: project protectionBypass via Vercel API"
              exit 0
            fi
            echo "Vercel API reachable but the project has no protectionBypass secret configured."
          fi
          echo "No bypass available — the matrix will report a single PLATFORM CONFIG blocker."
          exit 0

      - name: Diagnose the preview surface
        env:
          URL: ${{ steps.preview.outputs.url }}
          BYPASS: ${{ steps.bypass.outputs.value }}
        run: |
          set +e
          for p in /api/health /voice-dna; do
            echo "─────────── GET $URL$p"
            curl -sS -o /tmp/body -D /tmp/hdr \
              ${BYPASS:+-H "x-vercel-protection-bypass: $BYPASS"} \
              -w 'status=%{http_code} final=%{url_effective}\n' -L "$URL$p"
            grep -iE '^(x-vercel|location|content-type)' /tmp/hdr | head -6
            echo "--- first 200 bytes of body ---"
            head -c 200 /tmp/body; echo; echo
          done
          exit 0

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # Three ways in, in order of preference. All arrive as SECRETS — never as
      # workflow_dispatch inputs, which are recorded in the run's event payload
      # and are world-readable on this PUBLIC repository.
      #   VOICE_DNA_SHARE_TOKEN  — a Vercel authenticated share link's
      #                            `_vercel_share` token (short-lived).
      #   VERCEL_AUTOMATION_BYPASS_SECRET — a Protection Bypass secret.
      #   PREVIEW_TEST_SECRET    — must match the value set on the preview
      #                            deployment, or the login route stays off.
      - name: Run the Voice DNA live matrix
        env:
          VOICE_DNA_PREVIEW_URL: ${{ steps.preview.outputs.url }}
          VOICE_DNA_BYPASS: ${{ steps.bypass.outputs.value }}
          VOICE_DNA_SHARE_TOKEN: ${{ secrets.VOICE_DNA_SHARE_TOKEN }}
          PREVIEW_TEST_SECRET: ${{ secrets.PREVIEW_TEST_SECRET }}
        run: npx playwright test -c playwright.voicedna.config.ts

      - name: Upload matrix results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voice-dna-live-results
          path: |
            evaluation-results/voice-dna-live/
            test-results/voicedna-live-artifacts/
          if-no-files-found: warn
          retention-days: 7
