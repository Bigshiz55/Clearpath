name: preview-canonical-interpretation

# BLACK-BOX GATE AGAINST THE REAL PREVIEW.
#
# Runs only once Vercel reports a READY preview for the PR, then drives that
# deployment over HTTP — real route, real TMDB, real Supabase. It imports no
# application module and mocks nothing, because the failure this exists to catch
# (a sentence losing its meaning between the box and the results) is invisible
# to every in-process test.
#
# It must never silently skip. A missing preview, a SHA mismatch or a failed
# sign-in exits 2 and FAILS the job with an infrastructure message — quietly
# passing when the suite did not run is how a gate becomes decoration.

on:
  # `deployment_status` is the only event that fires when a preview is actually
  # READY. Running on `pull_request` would race the deployment and test either
  # nothing or the previous build.
  deployment_status:

permissions:
  contents: read
  deployments: read

jobs:
  black-box:
    # Only successful PREVIEW deployments. Production deployments are not this
    # gate's business, and a failed deployment has nothing to test.
    # SKIPPED, NOT SUCCESS, WHEN THERE IS NOTHING TO TEST. Every deployment
    # event fires this workflow, including PRODUCTION deployments — which have
    # no preview to test. The old shape handled that inside the first step
    # (run=false) and let every later step skip, so the JOB concluded green:
    # a push to main showed three passing deployed gates whose meaningful
    # steps never executed, and that vacuous green was cited as evidence that
    # main had passed them. A skipped gate must LOOK skipped. The job-level
    # guard makes the conclusion 'skipped' in the checks UI, which nothing can
    # mistake for a test pass; the in-step guard stays as a belt for event
    # shapes the expression cannot see.
    if: github.event.deployment_status.state == 'success' && !contains(github.event.deployment.environment, 'roduction')
    runs-on: ubuntu-latest
    steps:
      - name: Resolve the deployment under test
        id: target
        env:
          TARGET_URL: ${{ github.event.deployment_status.target_url }}
          ENVIRONMENT: ${{ github.event.deployment.environment }}
          SHA: ${{ github.event.deployment.sha }}
        run: |
          # The URL comes from the deployment event, never hard-coded: a preview
          # URL is ephemeral and pinning one would test a stale build forever.
          if [ -z "$TARGET_URL" ]; then
            echo "::error::No target_url on the deployment event — cannot resolve the preview."
            exit 1
          fi
          case "$ENVIRONMENT" in
            *[Pp]roduction*)
              echo "Skipping: this gate runs against previews, not production."
              echo "run=false" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          echo "url=$TARGET_URL" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "Deployment: $TARGET_URL (env=$ENVIRONMENT sha=$SHA)"

      - uses: actions/checkout@v4
        if: steps.target.outputs.run == 'true'

      - uses: actions/setup-node@v4
        if: steps.target.outputs.run == 'true'
        with:
          node-version: 20

      - name: Report what is configured (names only, never values)
        if: steps.target.outputs.run == 'true'
        env:
          HAS_LOGIN: ${{ secrets.PREVIEW_TEST_LOGIN_SECRET != '' }}
          HAS_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET != '' }}
          HAS_TMDB: ${{ secrets.TMDB_API_KEY != '' }}
        run: |
          # TWO secrets, presence only, reported by NAME so a gap can be fixed
          # without anyone pasting a value. The Supabase config and the test
          # user's credentials stay in Vercel Preview, where the deployment
          # already needs them — copying them here would widen the blast radius
          # of a leaked CI token for no gain.
          echo "PREVIEW_TEST_LOGIN_SECRET present:        $HAS_LOGIN"
          echo "VERCEL_AUTOMATION_BYPASS_SECRET present:  $HAS_BYPASS"
          echo "TMDB_API_KEY present (full-credit tier):  $HAS_TMDB"

      - name: Black-box canonical interpretation
        if: steps.target.outputs.run == 'true'
        env:
          BASE_URL: ${{ steps.target.outputs.url }}
          EXPECT_SHA: ${{ steps.target.outputs.sha }}
          PREVIEW_TEST_LOGIN_SECRET: ${{ secrets.PREVIEW_TEST_LOGIN_SECRET }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          set +e
          node eval/preview/canonical-interpretation.mjs
          code=$?
          set -e
          case $code in
            0) echo "::notice::Canonical interpretation holds against the real preview." ;;
            1) echo "::error::SEMANTIC failure — the deployed product misread a request." ;;
            2) echo "::error::INFRASTRUCTURE failure — the gate could not run. This is not a product verdict." ;;
            *) echo "::error::Unexpected exit $code" ;;
          esac
          exit $code

  taste-dna-proof:
    # PHASE 1 CLOSURE EVIDENCE. Signs in as the real preview identity and asks
    # the deployed /api/ask the three closure queries, then reads the ordering
    # proof straight out of the response: every item carries `matchScore` (the
    # pre-Phase-1 objective score) beside `personal.rankScore` and the evidence
    # that moved it, so before/after arrive together and no diagnostic endpoint
    # had to be added to production to see them.
    #
    # It is not a pass/fail product gate — it is a measurement, and it fails only
    # if personalization changes the MEMBERSHIP of an answer, breaches the +/-18
    # ceiling, or reorders with no DNA participating.
    # SKIPPED, NOT SUCCESS, WHEN THERE IS NOTHING TO TEST. Every deployment
    # event fires this workflow, including PRODUCTION deployments — which have
    # no preview to test. The old shape handled that inside the first step
    # (run=false) and let every later step skip, so the JOB concluded green:
    # a push to main showed three passing deployed gates whose meaningful
    # steps never executed, and that vacuous green was cited as evidence that
    # main had passed them. A skipped gate must LOOK skipped. The job-level
    # guard makes the conclusion 'skipped' in the checks UI, which nothing can
    # mistake for a test pass; the in-step guard stays as a belt for event
    # shapes the expression cannot see.
    if: github.event.deployment_status.state == 'success' && !contains(github.event.deployment.environment, 'roduction')
    runs-on: ubuntu-latest
    steps:
      - name: Resolve the deployment under test
        id: target
        env:
          TARGET_URL: ${{ github.event.deployment_status.target_url }}
          ENVIRONMENT: ${{ github.event.deployment.environment }}
          SHA: ${{ github.event.deployment.sha }}
        run: |
          if [ -z "$TARGET_URL" ]; then
            echo "::error::No target_url on the deployment event."
            exit 1
          fi
          case "$ENVIRONMENT" in
            *[Pp]roduction*)
              echo "Skipping: the preview test identity is inert on production."
              echo "run=false" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          echo "url=$TARGET_URL" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "run=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.target.outputs.run == 'true'
      - uses: actions/setup-node@v4
        if: steps.target.outputs.run == 'true'
        with:
          node-version: 20

      - name: Prove Taste DNA ordering against the real deployment
        if: steps.target.outputs.run == 'true'
        env:
          BASE_URL: ${{ steps.target.outputs.url }}
          EXPECT_SHA: ${{ steps.target.outputs.sha }}
          PREVIEW_TEST_LOGIN_SECRET: ${{ secrets.PREVIEW_TEST_LOGIN_SECRET }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set +e
          node eval/preview/taste-dna-proof.mjs
          code=$?
          set -e
          case $code in
            0) echo "::notice::Taste DNA proof captured against the real deployment." ;;
            1) echo "::error::PROOF failure — personalization violated a documented invariant." ;;
            2) echo "::error::INFRASTRUCTURE failure — the proof could not run. Not a product verdict." ;;
          esac
          exit $code

  ui-journey:
    # The browser half of the same proof: the ORIGINAL INCIDENT typed through
    # the real deployed UI, asserted down to the rendered poster grid.
    # SKIPPED, NOT SUCCESS, WHEN THERE IS NOTHING TO TEST. Every deployment
    # event fires this workflow, including PRODUCTION deployments — which have
    # no preview to test. The old shape handled that inside the first step
    # (run=false) and let every later step skip, so the JOB concluded green:
    # a push to main showed three passing deployed gates whose meaningful
    # steps never executed, and that vacuous green was cited as evidence that
    # main had passed them. A skipped gate must LOOK skipped. The job-level
    # guard makes the conclusion 'skipped' in the checks UI, which nothing can
    # mistake for a test pass; the in-step guard stays as a belt for event
    # shapes the expression cannot see.
    if: github.event.deployment_status.state == 'success' && !contains(github.event.deployment.environment, 'roduction')
    runs-on: ubuntu-latest
    steps:
      - name: Resolve the deployment under test
        id: target
        env:
          TARGET_URL: ${{ github.event.deployment_status.target_url }}
          ENVIRONMENT: ${{ github.event.deployment.environment }}
          SHA: ${{ github.event.deployment.sha }}
        run: |
          if [ -z "$TARGET_URL" ]; then
            echo "::error::No target_url on the deployment event."
            exit 1
          fi
          case "$ENVIRONMENT" in
            *[Pp]roduction*)
              echo "run=false" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          echo "url=$TARGET_URL" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "run=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.target.outputs.run == 'true'
      - uses: actions/setup-node@v4
        if: steps.target.outputs.run == 'true'
        with:
          node-version: 20
      - name: Install dependencies
        if: steps.target.outputs.run == 'true'
        run: npm ci
      - name: Install chromium
        if: steps.target.outputs.run == 'true'
        run: npx playwright install --with-deps chromium
      - name: Drive the real UI against the exact-SHA preview
        if: steps.target.outputs.run == 'true'
        env:
          BASE_URL: ${{ steps.target.outputs.url }}
          PREVIEW_TEST_LOGIN_SECRET: ${{ secrets.PREVIEW_TEST_LOGIN_SECRET }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: npx playwright test -c playwright.preview.config.ts
