name: Refresh TV ingest

# Hourly external trigger for the TVmaze + TV Media ingest into the 0032 tv_*
# tables. Vercel's Hobby plan caps at two cron jobs, both already spent, and
# Hobby cron only fires daily anyway — so an external hourly scheduler is the
# documented way to run this (docs/SCHEDULE_PROVIDERS.md).
#
# ── WHY THIS NO LONGER USES CRON_SECRET ───────────────────────────────────
# It used to call /api/cron/tv-ingest with a bearer token that had to match
# the deployment's CRON_SECRET byte for byte. The two values drifted, and the
# workflow then failed with HTTP 401 every hour for days while TV Media
# quietly stopped refreshing.
#
# That design made "two secrets in two vendors' dashboards stay identical
# forever" a hard dependency of the data pipeline, for an operation that
# needs no authorization in the first place. The ingest is:
#
#   - idempotent — it reconciles a window, it does not append;
#   - self-gated — TVmaze at most once per UTC day, TV Media at most once
#     every two hours, both enforced server-side against tv_ingestion_runs,
#     plus the monthly call budget;
#   - caller-controlled in no respect whatsoever — it takes no parameters.
#
# So calling /api/tv/refresh repeatedly cannot cost more than the schedule
# already allows, and the secret bought nothing but an outage. The
# authenticated route (/api/cron/tv-ingest) still exists and still checks its
# bearer token for anyone who wants it.
#
# SITE_URL remains a repository secret so this can be pointed at a staging
# deployment. If it is unset the workflow targets production directly rather
# than failing, because a missing URL should not stop the pipeline either.
#
# ── WHAT THIS TICK CAN AND CANNOT REACH ───────────────────────────────────
# This schedule drives the FREE providers only. TV Media is metered, and the
# data-mode gate (src/lib/tv/dataMode.ts) refuses it unless BOTH
# DATA_MODE=paid_live and TVMEDIA_ENABLED=1 are set on the deployment —
# neither of which is set today. `runGatedTvIngest` asks that gate before it
# takes a lease or constructs the adapter, so this tick makes zero TV Media
# requests and the response reports `tvmedia.status = "egress_denied"` with
# the reason. That is the switch working; check_tv_refresh.py treats it as a
# notice, not a failure.
#
# Deleting this schedule would NOT have made TV Media safe — two other
# triggers reach the same code (the daily Vercel cron and /api/cron/tv-ingest).
# The gate covers all three, which is why the schedule can stay: TVmaze is
# free and still worth refreshing hourly.

on:
  schedule:
    - cron: '0 * * * *' # top of every hour (UTC)
  workflow_dispatch: {}

concurrency:
  group: tv-ingest-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trigger TV listings ingest
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          set -euo pipefail
          BASE="${SITE_URL:-https://clearpath-pearl-chi.vercel.app}"
          BASE="${BASE%/}"
          echo "Target: $BASE"

          code=$(curl -sS -X POST -o /tmp/out.json -w "%{http_code}" \
            --max-time 290 "$BASE/api/tv/refresh")
          echo "HTTP $code"
          cat /tmp/out.json || true
          echo

          if [ "$code" != "200" ]; then
            echo "::error::TV ingest trigger returned HTTP $code (expected 200). This endpoint requires no credentials, so this is a reachability or server error, not a configuration mismatch."
            exit 1
          fi

          python3 scripts/check_tv_refresh.py /tmp/out.json
