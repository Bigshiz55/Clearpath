name: CI

# Required merge gates for main. The main-branch ruleset references these job
# names as required status checks ("CI / typecheck" etc.) — renaming a job here
# silently breaks that mapping, so treat job names as repository governance.
#
# Everything here runs WITHOUT secrets: env validation is at runtime by design
# (src/lib/env.ts), and the browser suite boots the built app with harness env
# values baked into playwright.searchrouting.config.ts.

on:
  pull_request:
  workflow_dispatch:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint

  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx vitest run
      # AN ORDINARY TEST RUN IS READ-ONLY. The evaluation suites used to write
      # eight tracked files in evaluation-results/ on every invocation, stamped
      # with whichever branch happened to execute them — meaningless diffs,
      # rebase conflicts in shared evidence, and false provenance (main was
      # left naming a deleted branch). Regeneration is now explicit
      # (`npm run eval:refresh`). This fails the build if that ever regresses.
      # The arch guard in eval/runner/artifacts.arch.test.ts catches it at the
      # source; this catches it at the outcome, including any writer it cannot
      # see statically.
      - name: evaluation evidence is unchanged by an ordinary test run
        run: git diff --exit-code -- evaluation-results

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

  browser-routing:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test -c playwright.searchrouting.config.ts
